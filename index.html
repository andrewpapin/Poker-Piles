<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom stays available. `touch-action: manipulation`
         in the stylesheet already kills the double-tap zoom this was guarding against. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Party (the default) is dark-grounded; the `dark` theme value is now a
         light-grounded room instead (see styles.css) — so color-scheme and
         theme-color both have to flip with the choice below, not just paint
         once. The values here are Party's, overwritten by the script when the
         stored or system-preferred theme is `dark`. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <!-- Stamps data-theme on <html> before first paint, so the page never
         flashes the wrong theme then swaps. Reads the same explicit choice
         App.tsx persists (game/storage.ts's `pokerpiles:v2:theme`), falling
         back to the system preference only when the player has never
         toggled — the toggle in the header is the source of truth after
         that, not the phone's setting. Keep the storage key literal here in
         sync with storage.ts; this must stay plain, synchronous script (no
         module, no defer) so it runs before the stylesheet paints. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('pokerpiles:v2:theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable — fall through with the Party default.
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6fb');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker Piles" />
    <meta
      name="description"
      content="A daily poker puzzle. Build the best hands you can from eight piles of cards. Same deal for everyone, every day."
    />

    <!-- An inline data URI rather than a file: the site is served from a
         sub-path (/Poker-Piles/), and a data URI has no path to get wrong. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23f472b6'/%3E%3Cpath transform='translate(3.4 3.1) scale(0.72)' d='M12 2.2C12 2.2 4.6 8.6 4.6 13.1c0 2.6 1.9 4.5 4.3 4.5 1.2 0 2.2-.5 2.8-1.2-.2 2.1-1.1 3.8-2.5 4.9v.5h5.6v-.5c-1.4-1.1-2.3-2.8-2.5-4.9.6.7 1.6 1.2 2.8 1.2 2.4 0 4.3-1.9 4.3-4.5C19.4 8.6 12 2.2 12 2.2z' fill='%2309090b'/%3E%3C/svg%3E"
    />
    <!-- Relative, so it resolves under the deploy base rather than the domain root. -->
    <link rel="manifest" href="manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poker Piles" />
    <meta property="og:title" content="Poker Piles — a daily poker puzzle" />
    <meta
      property="og:description"
      content="Eight piles, one deck, five cards at a time. Same deal for everyone, every day."
    />
    <meta property="og:url" content="https://andrewpapin.github.io/Poker-Piles/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Poker Piles — a daily poker puzzle" />
    <meta
      name="twitter:description"
      content="Eight piles, one deck, five cards at a time. Same deal for everyone, every day."
    />

    <title>Poker Piles</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
